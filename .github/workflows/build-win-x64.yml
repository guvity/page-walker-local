name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Publish portable win-x64 folder
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore src/PageWalkerLocal/PageWalkerLocal.csproj

      - name: Publish self-contained win-x64
        run: dotnet publish src/PageWalkerLocal/PageWalkerLocal.csproj -c Release -r win-x64 --self-contained true -o artifacts/PageWalkerLocal-win-x64

      - name: Copy MSVC runtime for app-local native dependencies
        shell: pwsh
        run: |
          $artifact = "artifacts/PageWalkerLocal-win-x64"
          $vs2022Root = Join-Path $env:ProgramFiles "Microsoft Visual Studio\2022"
          if (-not (Test-Path $vs2022Root)) {
            Write-Error "Visual Studio 2022 redist root was not found at '$vs2022Root'."
            exit 1
          }

          $crtDir = Get-ChildItem -Path $vs2022Root -Recurse -Directory -Filter "Microsoft.VC*.CRT" |
            Where-Object { $_.FullName -match "\\VC\\Redist\\MSVC\\[^\\]+\\x64\\Microsoft\.VC\d+\.CRT$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $crtDir) {
            Write-Error "Could not find an x64 Microsoft.VC*.CRT redist directory under '$vs2022Root'."
            exit 1
          }

          Write-Host "Copying MSVC CRT runtime DLLs from '$($crtDir.FullName)' to '$artifact'."
          Copy-Item -Path (Join-Path $crtDir.FullName "*.dll") -Destination $artifact -Force

          $required = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($name in $required) {
            $path = Join-Path $artifact $name
            if (-not (Test-Path $path)) {
              Write-Error "Required app-local MSVC runtime DLL is missing after copy: $name"
              exit 1
            }
          }

          Get-ChildItem $artifact -File |
            Where-Object { $_.Name -match "^(msvcp140|vcruntime140|concrt140)" } |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Print native dependency files
        shell: pwsh
        run: |
          $artifact = "artifacts/PageWalkerLocal-win-x64"
          Write-Host "onnxruntime DLLs:"
          $onnx = Get-ChildItem -Recurse $artifact -Filter "onnxruntime*.dll" | Select-Object FullName, Length
          $onnx | Format-Table -AutoSize
          if (-not $onnx) {
            Write-Error "No onnxruntime*.dll files were found in the published artifact."
            exit 1
          }

          Write-Host "SkiaSharp DLLs:"
          Get-ChildItem -Recurse $artifact -Filter "SkiaSharp*.dll" | Select-Object FullName, Length | Format-Table -AutoSize

          Write-Host "MSVC runtime DLLs:"
          $msvc = Get-ChildItem $artifact -File |
            Where-Object { $_.Name -match "^(msvcp140|vcruntime140|concrt140)" } |
            Select-Object FullName, Length
          $msvc | Format-Table -AutoSize
          foreach ($name in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            if (-not (Test-Path (Join-Path $artifact $name))) {
              Write-Error "Required app-local MSVC runtime DLL is missing from artifact: $name"
              exit 1
            }
          }

          Write-Host "Native/runtimes DLLs:"
          Get-ChildItem -Recurse $artifact -Filter "*.dll" |
            Where-Object { $_.FullName -match "native|runtimes" } |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Run model discovery self-test
        shell: pwsh
        run: |
          & artifacts/PageWalkerLocal-win-x64/PageWalkerLocal.exe --model-discovery-test

      - name: Run OCR self-test
        shell: pwsh
        run: |
          & artifacts/PageWalkerLocal-win-x64/PageWalkerLocal.exe --ocr-self-test
          $code = $LASTEXITCODE
          if ($code -ne 0 -and $code -ne 2) {
            Write-Error "OCR self-test failed with exit code $code."
            exit $code
          }
          if ($code -eq 2) {
            Write-Warning "OCR self-test did not find a complete custom model set; bundled/default init path was tested."
          }
          exit 0

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/PageWalkerLocal-win-x64/* -DestinationPath artifacts/PageWalkerLocal-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PageWalkerLocal-win-x64
          path: artifacts/PageWalkerLocal-win-x64.zip
          if-no-files-found: error
